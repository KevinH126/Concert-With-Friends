# Render Blueprint for the Concert-With-Friends backend (P1.5).
# Web API + managed Postgres only. Redis + Celery worker/beat are added in P4.
#
# NOTE ON PLAN SLUGS: Render has changed plan identifiers over time. Verify the
# current slugs in the Render dashboard/docs before first apply if a deploy is
# rejected (web `plan:` and database `plan:`).
databases:
  - name: cwf-db
    databaseName: concert_friends
    user: concert_friends
    # Paid, persistent, daily backups. Free Postgres is DELETED ~90 days in.
    # Slug is hyphenated; legacy names (starter/standard) can't be used for new DBs.
    plan: basic-256mb
    region: virginia # <-- change to the region nearest you

services:
  - type: web
    name: cwf-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: virginia # <-- keep same region as the database
    # Free web tier spins down when idle (cold start ~30-50s). Flip to a paid
    # plan (e.g. `standard`) BEFORE sharing the link publicly.
    plan: free
    healthCheckPath: /health
    # preDeployCommand (auto-migrate) is NOT allowed on free-tier services, so it's
    # omitted here. Until the web service is on a paid plan, run migrations manually
    # from your laptop against the DB's external URL (see docs/DEPLOY.md). When you
    # upgrade, add:  preDeployCommand: alembic upgrade head
    autoDeploy: true # deploy on push to main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cwf-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Render generates + stores; never in git
      - key: ADMIN_TOKEN
        generateValue: true # ops token for /admin; distinct from SECRET_KEY
      - key: TICKETMASTER_API_KEY
        sync: false # paste in the Render dashboard (not committed)
      - key: REDIS_URL # web enqueues friend-mark pings to the worker (P4)
        fromService:
          type: redis
          name: cwf-redis
          property: connectionString

  # P4 notification pipeline: worker + beat in ONE process at concurrency 1 (sequential
  # metros keep the TM 5-req/sec ceiling safe). Same Docker image as the web service, with
  # the command overridden to run Celery instead of uvicorn. This is the first PAID service
  # beyond Postgres (~$7/mo); free tier has no background workers.
  - type: worker
    name: cwf-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: virginia # keep same region as the database + web
    plan: starter # VERIFY the current slug in the dashboard before apply
    dockerCommand: celery -A app.worker worker -B --concurrency=1 --loglevel=info
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cwf-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cwf-redis
          property: connectionString
      - key: TICKETMASTER_API_KEY
        sync: false # the worker runs the metro sync — needs the real key (same as web)
      # secret_key / admin_token are required by app.config but unused by the worker
      # (it issues no JWTs, serves no admin routes) — any value is fine.
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true

  # Broker + result backend for Celery. Free Key Value tier (no persistence): the queue is
  # transient — a restart at most loses an in-flight nightly run, which the next diff
  # re-derives (idempotent by design). VERIFY the free plan slug/size in the dashboard.
  - type: redis
    name: cwf-redis
    region: virginia # MUST match the worker/db — cross-region private DNS won't resolve
    plan: free
    ipAllowList: [] # reachable only from within the Render private network
